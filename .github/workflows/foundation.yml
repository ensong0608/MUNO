name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run foundation tests
        run: python -m unittest discover -s tests -p "test_foundation.py" -v
      - name: Check patch whitespace
        run: git diff --check HEAD^
